# Безкоштовний робот: кожні 15 хвилин збирає графіки відключень і зберігає їх у data/outages.json
name: Графіки відключень

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Спільна черга з роботом новин, щоб вони не зберігали зміни одночасно
concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Версії закріплені точним хешем, щоб їх не можна було непомітно підмінити
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: node scripts/collect-outages.mjs
      - name: Зберегти, якщо щось змінилось
        run: |
          if git diff --quiet data/outages.json; then
            echo "Без змін"
          else
            git config user.name "sonyakh-bot"
            git config user.email "sonyakh-bot@users.noreply.github.com"
            git add data/outages.json
            git commit -m "Оновлено графіки відключень"
            git pull --rebase
            git push
          fi
