<!doctype html>
<!-- Джерело картинки-прев'ю icons/og-image.png (1200×630). Щоб перемалювати, відкрий у Chrome
     у вікні 1200×630 і зроби знімок, або попроси Claude. -->
<html lang="uk">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@600;700&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: Manrope, sans-serif; background: #12203A; color: #fff; position: relative; }
  .glow { position: absolute; right: -140px; top: -120px; width: 720px; height: 720px; border-radius: 50%; background: radial-gradient(circle, #FFCF3333 0%, #FFCF3300 70%); }
  .text { position: absolute; left: 80px; top: 92px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand h1 { margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 104px; letter-spacing: -0.03em; line-height: 1; }
  .tagline { margin: 36px 0 0; font-family: Unbounded, sans-serif; font-weight: 500; font-size: 40px; line-height: 1.22; color: #FFCF33; }
  .features { margin: 36px 0 0; display: flex; flex-wrap: wrap; gap: 14px; }
  .chip { padding: 12px 22px; border-radius: 999px; background: #22325A; font-size: 25px; font-weight: 700; color: #EEF2FA; }
  .foot { position: absolute; left: 80px; bottom: 56px; font-size: 26px; font-weight: 700; color: #A8B5D1; }
  .foot b { color: #8FE3B0; }
  .flower { position: absolute; right: 70px; top: 115px; width: 400px; height: 400px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="text">
    <div class="brand"><h1>Сонях</h1></div>
    <p class="tagline">Трохи світла,<br>навіть коли важко</p>
    <div class="features">
      <span class="chip">Режим укриття</span>
      <span class="chip">Добрі новини</span>
      <span class="chip">Графік світла</span>
      <span class="chip">Ігри для дітей</span>
    </div>
  </div>
  <p class="foot"><b>Безкоштовно</b> · працює без інтернету</p>
  <svg class="flower" viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="16" cy="16" r="15.5" fill="#FFCF33" opacity=".12"/>
    <g fill="#FFCF33">
      <ellipse cx="16" cy="6.5" rx="3" ry="5"/><ellipse cx="16" cy="25.5" rx="3" ry="5"/>
      <ellipse cx="6.5" cy="16" rx="5" ry="3"/><ellipse cx="25.5" cy="16" rx="5" ry="3"/>
      <ellipse cx="9.3" cy="9.3" rx="3" ry="5" transform="rotate(-45 9.3 9.3)"/><ellipse cx="22.7" cy="22.7" rx="3" ry="5" transform="rotate(-45 22.7 22.7)"/>
      <ellipse cx="22.7" cy="9.3" rx="3" ry="5" transform="rotate(45 22.7 9.3)"/><ellipse cx="9.3" cy="22.7" rx="3" ry="5" transform="rotate(45 9.3 22.7)"/>
    </g>
    <circle cx="16" cy="16" r="6" fill="#7A4A12"/>
    <circle cx="14" cy="14.2" r=".7" fill="#A0682A"/><circle cx="17.6" cy="13.8" r=".7" fill="#A0682A"/>
    <circle cx="15.8" cy="17.6" r=".7" fill="#A0682A"/><circle cx="18.4" cy="17" r=".7" fill="#A0682A"/><circle cx="13.6" cy="17.4" r=".7" fill="#A0682A"/>
  </svg>
</body>
</html>
