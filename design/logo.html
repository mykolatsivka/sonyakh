<!doctype html>
<!-- Джерело логотипа Соняха. ?bg=dark (темний фон) або ?bg=yellow (жовтий фон).
     Квадрат 1024×1024; у Telegram аватар обрізається колом, тому соняшник по центру з полями. -->
<html lang="uk">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; background: #12203A; }
  body.yellow { background: #FFCF33; }
  svg { width: 760px; height: 760px; }
</style>
</head>
<body>
<svg viewBox="0 0 32 32" aria-label="Сонях">
  <g id="petals" fill="#FFCF33">
    <ellipse cx="16" cy="6.5" rx="3" ry="5"/><ellipse cx="16" cy="25.5" rx="3" ry="5"/>
    <ellipse cx="6.5" cy="16" rx="5" ry="3"/><ellipse cx="25.5" cy="16" rx="5" ry="3"/>
    <ellipse cx="9.3" cy="9.3" rx="3" ry="5" transform="rotate(-45 9.3 9.3)"/><ellipse cx="22.7" cy="22.7" rx="3" ry="5" transform="rotate(-45 22.7 22.7)"/>
    <ellipse cx="22.7" cy="9.3" rx="3" ry="5" transform="rotate(45 22.7 9.3)"/><ellipse cx="9.3" cy="22.7" rx="3" ry="5" transform="rotate(45 9.3 22.7)"/>
  </g>
  <circle cx="16" cy="16" r="6" fill="#7A4A12"/>
  <circle cx="14" cy="14.2" r=".7" fill="#A0682A"/><circle cx="17.6" cy="13.8" r=".7" fill="#A0682A"/>
  <circle cx="15.8" cy="17.6" r=".7" fill="#A0682A"/><circle cx="18.4" cy="17" r=".7" fill="#A0682A"/><circle cx="13.6" cy="17.4" r=".7" fill="#A0682A"/>
</svg>
<script>
  if (new URLSearchParams(location.search).get('bg') === 'yellow') {
    document.body.classList.add('yellow');
    document.getElementById('petals').setAttribute('fill', '#FFFFFF');
  }
</script>
</body>
</html>
